<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Add user</title>
</head>
<body>
    <p><a href="/">← Back</a></p>
    <h1>Add user</h1>

    {% if error %}
    <p>{{ error }}</p>
    {% endif %}

    <form method="post" action="/users">
        <p>
            <label>Name</label><br>
            <input type="text" name="name" required value="{{ name }}">
        </p>
        <p>
            <label>Email</label><br>
            <input type="email" name="email" value="{{ email }}">
        </p>
        <p>
            <label>
                <input type="checkbox" name="notify_email" value="on"
                    {% if notify_email %}checked{% endif %}>
                Notify email
            </label>
        </p>
        <p>
            <label>Telegram chat id</label><br>
            <input type="text" name="telegram_chat_id" value="{{ telegram_chat_id }}">
        </p>
        <p>
            <label>
                <input type="checkbox" name="notify_telegram" value="on"
                    {% if notify_telegram %}checked{% endif %}>
                Notify telegram
            </label>
        </p>
        <button type="submit">Save</button>
    </form>
</body>
</html>
